# Publishes ./dist to GitHub Pages using the official Actions integration.
#
# After the first successful run, set:
#   Repo → Settings → Pages → Build and deployment → Source: GitHub Actions
# (Not “Deploy from a branch”.)
#
# If the site was blank before: Jekyll on Pages ignored paths under `assets/` unless
# `.nojekyll` exists — we ship `public/.nojekyll` into dist via Vite.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
